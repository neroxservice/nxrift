<!doctype html>
<html><head><meta charset="utf-8"><title>Neuer Tab</title>
<style>
:root{--p:#ff3ea5;--c:#2de1e6}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;color:#e8e8f5;font:15px 'Segoe UI',sans-serif;
background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--p) 18%,transparent),transparent 45%),radial-gradient(circle at 80% 80%,color-mix(in srgb,var(--c) 18%,transparent),transparent 45%),#0a0a12}
.logo{width:100px;filter:drop-shadow(0 0 22px var(--p))}
h1{font-size:40px;letter-spacing:6px;background:linear-gradient(90deg,var(--p),#b36bff,var(--c));-webkit-background-clip:text;color:transparent}
p.s{opacity:.55;margin-top:-14px;letter-spacing:3px;font-size:12px}
form{width:min(560px,86vw)}
input{width:100%;height:48px;border-radius:24px;border:1px solid #25253f;background:#12121f;color:#fff;padding:0 24px;font:inherit;outline:0}
input:focus{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,104px);gap:14px;justify-content:center;width:min(860px,94vw)}
.t{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;background:rgba(18,18,31,.75);border:1px solid #1e1e33;color:#e8e8f5;text-decoration:none;font-size:12px;transition:.2s}
.t:hover{border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 30%,transparent);transform:translateY(-3px)}
.t i{width:40px;height:40px;border-radius:12px;background:#1a1a2e;display:grid;place-items:center;font:700 18px 'Segoe UI';color:var(--c);font-style:normal;overflow:hidden}
.t i img{width:26px;height:26px}
.t span{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<img class="logo" src="logo.png"><h1>nxRift</h1><p class="s">nxService &amp; Streams</p>
<form id="f"><input id="q" placeholder="Suchen oder URL eingeben" autofocus></form>
<div id="tiles"></div>
<script>
let QP='https://www.google.com/search?q=';
f.onsubmit=e=>{e.preventDefault();let v=q.value.trim();if(!v)return;
location.href=/^[a-z]+:\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(v)?'https://'+v:QP+encodeURIComponent(v)};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return ''}};
function tile(title,url,letter,icon){const a=document.createElement('a');a.className='t';a.href=url;a.title=url;
  const i=document.createElement('i');
  if(icon){const im=new Image();im.src=icon;im.onerror=()=>{im.remove();i.textContent=letter};i.append(im)}else i.textContent=letter;
  const s=document.createElement('span');s.textContent=title;a.append(i,s);tiles.append(a)}
(async()=>{
  try{const t=await nxh.theme(),r=document.documentElement.style;r.setProperty('--p',t.p);r.setProperty('--c',t.c);QP=t.q||QP;if(t.bg){const d=(t.dim||0)/100,L=document.createElement('div'),n=document.createElement('div');
  n.style.cssText=`position:absolute;inset:0;background:linear-gradient(rgba(10,10,18,${d}),rgba(10,10,18,${d})),url("${t.bg}") ${t.x}% ${t.y}%/${t.fit} no-repeat;transform:scale(${(t.zoom||100)/100});transform-origin:${t.x}% ${t.y}%`;
  L.style.cssText='position:fixed;inset:0;z-index:-1;overflow:hidden';L.append(n);document.body.style.background='#0a0a12';document.body.prepend(L)}}catch{}
  try{(await nxh.pins()).slice(0,24).forEach(p=>{if(/^https?:/i.test(p.url))tile(p.title||host(p.url),p.url,(host(p.url)[0]||'?').toUpperCase(),p.icon)})}catch{}
  tile('Einstellungen','settings.html','⚙');
})();
</script></body></html>
